name: Deploy slides to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'slides/**'
      - 'team/**'
      - '.github/workflows/deploy-slides.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -R slides/. _site/
          if [ -d team ]; then
            mkdir -p _site/team
            cp -R team/. _site/team/
          fi
          # rewrite relative ../team/ paths to team/ since HTML now sits at site root
          sed -i 's|\.\./team/|team/|g' _site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
